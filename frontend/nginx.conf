# Protocolo repassado à API. Atrás do nginx do host (VPS), a requisição chega aqui
# em HTTP com `X-Forwarded-Proto: https`, que o host sempre reescreve. Só o valor
# exato "https" é aceito; qualquer outro vira o esquema desta conexão. A porta
# deste container só é publicada em 127.0.0.1, então o único cliente que pode
# definir o cabeçalho é o proxy do próprio servidor.
map $http_x_forwarded_proto $proto_repassado {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 21m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Usado pelo healthcheck do container.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy da API: o frontend usa caminho relativo (/api/v1), então a
    # mesma imagem roda em qualquer host e não há CORS entre as duas.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_repassado;
        proxy_read_timeout 120s;
    }

    # Documentação da API, útil em ambiente local.
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Configuração de runtime, reescrita a cada start do container.
    # Precisa vir ANTES da regra de cache de estáticos e, por ser `location =`,
    # tem prioridade sobre ela. Sem isto o navegador guardaria por um ano a
    # configuração de um deploy antigo — e trocar a federação servida não
    # surtiria efeito nenhum até alguém limpar o cache.
    location = /env-config.js {
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
