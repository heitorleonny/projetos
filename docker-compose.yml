# docker compose --env-file .env.docker up --build -d
# Gere as senhas com: python3 scripts/configurar_docker.py
name: portal-federacoes

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal_owner}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - portal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["python", "/operacao/migrar_postgres.py"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal_owner}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
      INGESTAO_DB_PASSWORD: ${INGESTAO_DB_PASSWORD:-}
    volumes:
      - ./infra:/infra:ro
      - ./scripts/migrar_postgres.py:/operacao/migrar_postgres.py:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DATABASE_DSN: postgresql://portal_app:${APP_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-portal}
      AUTH_DATABASE_DSN: postgresql://portal_auth:${AUTH_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-portal}
      INGESTAO_DSN: postgresql://app_ingestao:${INGESTAO_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-portal}
      CONVITE_REDIRECT_URL: ${CONVITE_REDIRECT_URL:-http://localhost:8080/definir-senha}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      TENANT_CLAIM_OBRIGATORIO: "true"
      IA_BASE_URL: ${IA_BASE_URL:-}
      IA_PROVEDOR: ${IA_PROVEDOR:-openrouter}
      IA_MODELO: ${IA_MODELO:-}
      IA_API_KEY: ${IA_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: /api/v1
      USE_MOCK: "false"
      TENANT_SLUG: ${TENANT_SLUG:-fejepe}
      FEEDBACK_FORM_URL: ${FEEDBACK_FORM_URL:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    command: ["python", "-m", "pytest", "-q", "-rs", "--require-lab"]
    volumes:
      - ./infra/db/init:/infra/db/init:ro
    environment:
      SUPABASE_URL: http://localhost
      SUPABASE_ANON_KEY: test-key-nao-usada
      LAB_DSN_DONO: postgresql://portal:portal@db-test:5432/portal_test
      LAB_DSN_APP: postgresql://app_authenticated:app_authenticated@db-test:5432/portal_test
      LAB_DSN_INGESTAO: postgresql://app_ingestao:app_ingestao@db-test:5432/portal_test
    depends_on:
      db-test:
        condition: service_healthy

  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal_test
    # Sem porta no host e sem volume persistente: todas as migrações são
    # reaplicadas em cada `make test`, sem apagar o laboratório ou a demo.
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U portal -d portal_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Laboratório isolado para desenvolvimento; não é o volume da aplicação.
  db:
    profiles: ["lab"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal_lab
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "portal", "-d", "portal_lab"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  portal_postgres:
  pgdata:
